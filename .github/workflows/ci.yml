name: cpu-ci
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q scripts src tests
      - name: Unit and pipeline tests
        run: python -m pytest -q tests
      - name: Full synthetic end-to-end smoke
        run: python scripts/run_pipeline.py --mode smoke --track all
      - name: Validate generated smoke decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metrics_path = Path("outputs/metrics_summary.json")
          decision_path = Path("outputs/release_decision.json")
          assert metrics_path.is_file(), "Metrics summary not generated"
          assert decision_path.is_file(), "Release decision not generated"
          decision = json.loads(decision_path.read_text(encoding="utf-8"))
          assert decision["status"] in {"PASS", "ITERATE", "BLOCK"}
          assert decision["reasons"], "Release decision has no justification"
          assert isinstance(decision["final_policy_snapshot"], dict)
          PY
